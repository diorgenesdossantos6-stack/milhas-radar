<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar de Milhas</title>
<meta name="description" content="Promoções de transferência de pontos e milhas, com o custo real do milheiro e comparação com o que o mercado paga.">
<meta name="theme-color" content="#0A1B3D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Paleta NovaSistem */
    --azul: #0A1B3D;
    --ciano: #00E5FF;
    --roxo: #7A00FF;
    --lilas: #B24DFF;
    --branco: #ffffff;

    /* Derivados para interface */
    --azul-painel: #0E2450;
    --azul-linha: #1C3568;
    --texto: #EAF0FA;
    --texto-fraco: #8EA3C8;
    --alerta: #FF5C7A;
    --gradiente: linear-gradient(90deg, var(--ciano) 0%, var(--roxo) 100%);

    --fonte: Montserrat, "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--azul); color: var(--texto);
    font-family: var(--fonte); font-weight: 400; font-size: 16px; line-height: 1.4;
    text-align: left;
  }
  /* O gradiente é acento, nunca fundo de página */
  body::before { content: ""; display: block; height: 4px; background: var(--gradiente); }
  .folha { max-width: 780px; margin: 0 auto; padding: 32px 20px 80px; }

  .topo { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
  .topo h1 { font-size: 2.1rem; font-weight: 700; letter-spacing: -.02em; margin: 0; }
  .estado { font-size: .8rem; font-weight: 600; color: var(--texto-fraco); font-variant-numeric: tabular-nums; }

  /* Destaque: a decisão do momento */
  .melhor { background: var(--azul-painel); border-radius: 10px; padding: 24px; margin-bottom: 40px; position: relative; overflow: hidden; }
  .melhor::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--gradiente); }
  .melhor .chamada { font-size: .82rem; font-weight: 600; color: var(--texto-fraco); margin: 0 0 14px; }
  .melhor .linha1 { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .melhor .figura { font-size: 3.6rem; font-weight: 700; line-height: .95; letter-spacing: -.04em; color: var(--ciano); font-variant-numeric: tabular-nums; }
  .melhor .rota { font-size: 1.25rem; font-weight: 600; letter-spacing: -.01em; }
  .melhor .sub { font-size: .95rem; color: var(--texto-fraco); margin: 10px 0 0; max-width: 60ch; }
  .melhor .fatos { display: flex; gap: 26px; flex-wrap: wrap; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--azul-linha); }
  .melhor .fatos div span { display: block; font-size: .72rem; font-weight: 600; color: var(--texto-fraco); margin-bottom: 2px; }
  .melhor .fatos div b { font-size: 1.05rem; font-weight: 700; font-variant-numeric: tabular-nums; }

  .melhor .motivo { margin: 14px 0 0; font-size: .86rem; font-weight: 600; }
  .secao { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin: 0 0 14px; }
  .secao h2 { font-size: 1.25rem; font-weight: 700; letter-spacing: -.01em; margin: 0; }
  .controles { display: flex; gap: 8px; }
  select {
    font-family: var(--fonte); font-size: .8rem; font-weight: 600; color: var(--texto);
    background: var(--azul-painel); border: 1px solid var(--azul-linha); border-radius: 6px; padding: 7px 10px;
  }
  select:focus-visible, input:focus-visible, .item:focus-visible, a:focus-visible {
    outline: 2px solid var(--ciano); outline-offset: 2px;
  }

  .lista { list-style: none; margin: 0; padding: 0; }
  .item {
    display: grid; grid-template-columns: 86px 1fr auto; gap: 6px 18px; align-items: baseline;
    width: 100%; text-align: left; background: var(--azul-painel); border: 0; border-radius: 10px;
    padding: 18px 20px; margin-bottom: 10px; color: inherit; font: inherit; cursor: pointer;
    border-left: 3px solid transparent;
  }
  .item:hover { border-left-color: var(--roxo); }
  .figura small { font-size: .32em; font-weight: 600; letter-spacing: 0; margin-left: 2px; }
  .item .figura { grid-row: span 2; font-size: 2rem; font-weight: 700; letter-spacing: -.035em; color: var(--ciano); font-variant-numeric: tabular-nums; }
  .item .rota { font-size: 1rem; font-weight: 600; letter-spacing: -.01em; }
  .item .quando { font-size: .78rem; font-weight: 600; color: var(--texto-fraco); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .item .quando.perto { color: var(--alerta); }
  .item .detalhe { grid-column: 2 / span 2; font-size: .86rem; color: var(--texto-fraco); }
  .sep { display: inline-block; width: 1.3em; }

  .vereditinho { font-weight: 700; font-size: .8rem; }
  .v-vale { color: var(--ciano); }
  .v-limite { color: var(--lilas); }
  .v-ruim { color: var(--alerta); }

  .fontes { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
  .fontes a {
    font-size: .72rem; font-weight: 600; color: var(--texto-fraco); text-decoration: none;
    background: rgba(255,255,255,.04); border-radius: 4px; padding: 3px 8px;
  }
  .fontes a:hover { color: var(--ciano); background: rgba(0,229,255,.1); }

  .conta { margin-top: 48px; }
  .caixa { background: var(--azul-painel); border-radius: 10px; padding: 24px; }
  .campos { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .campos label { display: flex; flex-direction: column; gap: 5px; font-size: .78rem; font-weight: 600; color: var(--texto-fraco); }
  .campos input, .campos select { font-size: .95rem; padding: 9px 11px; font-variant-numeric: tabular-nums; }
  .campos input {
    font-family: var(--fonte); font-weight: 600; background: var(--azul);
    border: 1px solid var(--azul-linha); border-radius: 6px; color: var(--texto);
  }
  .dica { font-size: .78rem; color: var(--texto-fraco); margin: 16px 0 0; max-width: 62ch; }
  .resultado { margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--azul-linha); }
  .resultado .fatos { display: flex; gap: 32px; flex-wrap: wrap; }
  .resultado .fatos div span { display: block; font-size: .74rem; font-weight: 600; color: var(--texto-fraco); margin-bottom: 3px; }
  .resultado .fatos div b { font-size: 1.6rem; font-weight: 700; letter-spacing: -.025em; font-variant-numeric: tabular-nums; }
  .resultado .fatos div:last-child b { color: var(--ciano); }
  .resultado .mercado { margin: 16px 0 0; font-size: .88rem; color: var(--texto-fraco); }

  .hist { margin-top: 48px; }
  .hist table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  .hist th { text-align: left; font-weight: 600; font-size: .74rem; color: var(--texto-fraco); padding: 8px 4px; border-bottom: 1px solid var(--azul-linha); }
  .hist td { padding: 10px 4px; border-bottom: 1px solid var(--azul-linha); font-variant-numeric: tabular-nums; }
  .hist td:nth-child(2) { font-weight: 700; color: var(--lilas); }

  .nada { color: var(--texto-fraco); padding: 20px 0; font-size: .9rem; }
  .pe { margin-top: 52px; padding-top: 20px; border-top: 1px solid var(--azul-linha);
        font-size: .78rem; color: var(--texto-fraco); line-height: 1.55; max-width: 72ch; }
  code { font-size: .9em; background: rgba(255,255,255,.06); padding: 1px 5px; border-radius: 3px; }

  @media (max-width: 440px) {
    .folha { padding: 24px 16px 64px; }
    .topo h1 { font-size: 1.6rem; }
    .melhor, .caixa { padding: 18px; }
    .melhor .figura { font-size: 2.8rem; }
    .item { grid-template-columns: 64px 1fr; padding: 16px; }
    .item .figura { font-size: 1.6rem; }
    .item .quando, .item .detalhe { grid-column: 2; }
    .resultado .fatos { gap: 20px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .item, .fontes a { transition: border-color .15s ease, background-color .15s ease, color .15s ease; }
  }
</style>
</head>
<body>
<div class="folha">
  <header class="topo">
    <h1>Radar de Milhas</h1>
    <p class="estado">carregando</p>
  </header>

  <section class="melhor" id="melhor" hidden></section>

  <section>
    <div class="secao">
      <h2>Outras promoções em aberto</h2>
      <div class="controles" id="controles"></div>
    </div>
    <ul class="lista" id="lista"></ul>
  </section>

  <section class="conta">
    <div class="secao"><h2>Quanto vai sair o seu milheiro</h2></div>
    <div class="caixa">
      <div class="campos">
        <label>Pontos a transferir
          <input id="cPontos" type="text" value="50000" inputmode="numeric" autocomplete="off"></label>
        <label>Custo dos seus pontos, por mil
          <input id="cCusto" type="text" value="30,00" inputmode="decimal" autocomplete="off"></label>
        <label>Bônus
          <input id="cBonus" type="text" value="80" inputmode="numeric" autocomplete="off"></label>
        <label>Pontos por milha
          <input id="cDesagio" type="text" value="1" inputmode="decimal" autocomplete="off"></label>
        <label>Programa de destino
          <select id="cPrograma"><option value="">sem comparação</option></select></label>
      </div>
      <p class="dica">Toque numa promoção da lista para trazer o bônus e o programa dela para cá.
        Pontos por milha é o deságio: em transferências de 3 pontos para 1 milha, use 3.</p>
      <div class="resultado" id="resultado"></div>
    </div>
  </section>

  <section class="hist">
    <div class="secao"><h2>Maior bônus já visto em cada rota</h2></div>
    <div id="historico"></div>
  </section>

  <p class="pe" id="pe"></p>
</div>
<script src="./painel.js"></script>
</body>
</html>
