name: Coletar promocoes de milhas

on:
  schedule:
    # A cada 30 minutos. O cron roda em UTC, mas como cobre todas as horas,
    # o fuso nao faz diferenca aqui. O GitHub despriorizar agendamento em
    # repositorio publico, entao o gatilho do Apps Script e quem garante a
    # cadencia: ele tambem precisa estar a cada 30 minutos.
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: coleta-milhas
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Coletar feeds e atualizar cotacao
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LIMITE_ALERTA: ${{ vars.LIMITE_ALERTA || '80' }}
        run: node src/coletar.mjs

      # Monta os JSON que o painel le. Tem que vir antes do commit, porque
      # agora eles tambem sao versionados: o painel os busca direto do GitHub,
      # e assim nenhuma hospedagem precisa reconstruir quando o dado muda.
      - name: Montar o site
        run: node src/build.mjs

      - name: Comitar dados
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data site/promocoes.json site/referencia.json site/livelo-parceiros.json
          if git diff --staged --quiet; then
            echo "Nada novo."
          else
            git commit -m "dados: coleta $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: coletar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v4
