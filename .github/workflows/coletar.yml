name: Coletar promocoes de milhas

on:
  schedule:
    # De hora em hora, 24h por dia, aos 7 minutos da hora. O cron roda em UTC,
    # mas como cobre todas as horas, o fuso nao faz diferenca aqui.
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coleta-milhas
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Coletar feeds e atualizar cotacao
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LIMITE_ALERTA: ${{ vars.LIMITE_ALERTA || '80' }}
        run: node src/coletar.mjs

      - name: Comitar dados
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "Nada novo."
          else
            git commit -m "dados: coleta $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
